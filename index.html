<!DOCTYPE html>
<html lang="es" data-theme="ingenieria">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio Virtual Multidisciplinario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" id="brand-mark">P</span>
      <div class="brand-text">
        <h1 id="site-title">Portafolio Virtual</h1>
        <p id="site-subtitle">Selecciona una carrera para comenzar</p>
      </div>
    </div>

    <div class="topbar-controls">
      <label class="career-select-wrap">
        <span class="career-select-label">Carrera</span>
        <select id="career-select">
          <option value="ingenieria">Ingeniería y Tecnología</option>
          <option value="salud">Medicina y Ciencias de la Salud</option>
          <option value="derecho">Derecho</option>
          <option value="humanidades">Arte y Humanidades</option>
        </select>
      </label>
